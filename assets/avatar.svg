<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sea" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b5f9e"/>
      <stop offset="1" stop-color="#0d2445"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#e0a93b"/>
      <stop offset="1" stop-color="#a86b12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sea)"/>
  <g transform="translate(256 256)" fill="none" stroke="url(#brass)" stroke-linecap="round">
    <!-- spokes with handles -->
    <g stroke-width="22" stroke="#d99c32">
      <line x1="0" y1="-200" x2="0" y2="200"/>
      <line x1="0" y1="-200" x2="0" y2="200" transform="rotate(45)"/>
      <line x1="0" y1="-200" x2="0" y2="200" transform="rotate(90)"/>
      <line x1="0" y1="-200" x2="0" y2="200" transform="rotate(135)"/>
    </g>
    <g fill="url(#brass)" stroke="none">
      <circle cx="0" cy="-205" r="20"/><circle cx="0" cy="205" r="20"/>
      <circle cx="-205" cy="0" r="20"/><circle cx="205" cy="0" r="20"/>
      <g transform="rotate(45)"><circle cx="0" cy="-205" r="20"/><circle cx="0" cy="205" r="20"/><circle cx="-205" cy="0" r="20"/><circle cx="205" cy="0" r="20"/></g>
    </g>
    <!-- rim -->
    <circle r="140" stroke-width="30"/>
    <circle r="140" stroke="#7a4c0c" stroke-width="4" stroke-opacity="0.5"/>
    <!-- hub -->
    <circle r="52" fill="#0d2445" stroke-width="18"/>
  </g>
  <!-- a hammer across the hub: the wright in shipwright -->
  <g transform="translate(256 256) rotate(-40)">
    <rect x="-9" y="-30" width="18" height="120" rx="7" fill="#c98a4b" stroke="#6b3e16" stroke-width="4"/>
    <rect x="-46" y="-62" width="92" height="38" rx="8" fill="#d9e2ec" stroke="#5b6b7d" stroke-width="5"/>
  </g>
</svg>
